name: Feature request
description: Propose a change for the AROS-NX build of Odyssey.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Does this belong upstream?
      options:
        - No, it is specific to AROS-NX
        - Yes, it should go to deadwood2/OdysseyWebBrowser as well
        - Not sure
    validations:
      required: true
